<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發票掃描測試</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f5f5f5}
.card{max-width:800px;margin:auto;background:#fff;padding:16px;border-radius:12px}
.video-wrap{position:relative}
video{width:100%;border-radius:12px;background:#000}
.scan-box{position:absolute;left:15%;top:35%;width:70%;height:18%;border:3px solid #00ff66;box-sizing:border-box;pointer-events:none}
input{width:100%;padding:10px;margin:6px 0 12px;font-size:18px}
button{padding:10px 16px;font-size:16px}
.small{color:#666;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h2>發票號碼即時掃描</h2>
<div class="video-wrap">
<video id="video" autoplay playsinline></video>
<div class="scan-box"></div>
</div>
<br>
<button onclick="startCamera()">啟動鏡頭</button>
<p class="small">請將發票號碼與總計金額置於綠框範圍內</p>
<label>發票號碼</label>
<input id="invoiceNo" readonly>
<label>金額(推測 - 以「總計/合計」為優先)</label>
<input id="amount" readonly>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let scanning = false;

async function startCamera(){
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = stream;
  } catch (e) {
    console.error('camera error', e);
    alert('無法取得相機權限：' + e.message);
  }
}

function normalizeOCRText(text){
  if(!text) return '';
  text = text.replace(/[\uFF10-\uFF19]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48));
  text = text.replace(/，/g, ',').replace(/。/g, '.').replace(/：/g, ':').replace(/／/g, '/');
  text = text.replace(/\u00A0/g, ' ');
  return text;
}

async function scan(){
  if(scanning || video.videoWidth === 0) return;
  scanning = true;
  const sx = video.videoWidth * 0.15;
  const sy = video.videoHeight * 0.35;
  const sw = video.videoWidth * 0.70;
  const sh = video.videoHeight * 0.18;
  canvas.width = sw; canvas.height = sh;
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

  try{
    const r = await Tesseract.recognize(canvas, 'chi_tra+eng', {
      logger: m => { /* 可開啟做除錯：console.log(m) */ }
    });
    let text = r.data.text || '';
    text = normalizeOCRText(text);
    console.log('OCR raw:', r.data.text);
    console.log('OCR normalized:', text);

    const totalPattern = /(總計|合計|總金額|總額|TOTAL|Total|AMOUNT)[\s:：]*([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/i;
    const totalPatternLoose = /(總計|合計|總金額|總額|TOTAL|Total|AMOUNT)[\s\S]{0,30}?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?)/i;

    let amountFound = null;
    let m = text.match(totalPattern);
    if(!m) m = text.match(totalPatternLoose);
    if(m){
      amountFound = m[2];
      const normalizedAmount = amountFound.replace(/,/g, '');
      document.getElementById('amount').value = normalizedAmount;
    } else {
      const withoutInv = text.replace(/[A-Z]{2}[- ]?\d{8}/g, ' ');
      const nums = withoutInv.match(/\d{1,3}(?:,\d{3})*(?:\.\d+)?/g);
      if(nums && nums.length){
        let max = 0;
        nums.forEach(n=>{
          let v = parseFloat(n.replace(/,/g,''));
          if(!isNaN(v) && v > max && v < 10000000) max = v;
        });
        if(max > 0) document.getElementById('amount').value = String(max);
      }
    }

    const invMatch = text.match(/[A-Z]{2}[- ]?\d{8}/);
    if(invMatch){
      document.getElementById('invoiceNo').value = invMatch[0].replace(/[- ]/g,'');
      navigator.vibrate && navigator.vibrate(100);
    }
  }catch(e){
    console.log(e);
  }
  scanning = false;
}

setInterval(scan, 1500);
</script>
</body>
</html>
