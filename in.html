<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>發票掃描測試</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:16px;background:#f5f5f5}
.card{max-width:800px;margin:auto;background:#fff;padding:16px;border-radius:12px}
.video-wrap{position:relative}
video{width:100%;border-radius:12px;background:#000}
.scan-box{position:absolute;left:15%;top:35%;width:70%;height:18%;border:3px solid #00ff66;box-sizing:border-box;pointer-events:none}
input{width:100%;padding:10px;margin:6px 0 12px;font-size:18px}
button{padding:10px 16px;font-size:16px}
.small{color:#666;font-size:12px}
</style>
</head>
<body>
<div class="card">
<h2>發票號碼即時掃描</h2>
<div class="video-wrap">
<video id="video" autoplay playsinline></video>
<div class="scan-box"></div>
</div>
<br>
<button onclick="startCamera()">啟動鏡頭</button>
<p class="small">請將發票號碼置於綠框範圍內</p>
<label>發票號碼</label>
<input id="invoiceNo" readonly>
<label>金額(推測)</label>
<input id="amount" readonly>
<canvas id="canvas" style="display:none"></canvas>
</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let scanning=false;
async function startCamera(){
 const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
 video.srcObject=stream;
}
async function scan(){
 if(scanning||video.videoWidth===0) return;
 scanning=true;
 const sx=video.videoWidth*0.15;
 const sy=video.videoHeight*0.35;
 const sw=video.videoWidth*0.70;
 const sh=video.videoHeight*0.18;
 canvas.width=sw; canvas.height=sh;
 ctx.drawImage(video,sx,sy,sw,sh,0,0,sw,sh);
 try{
  const r=await Tesseract.recognize(canvas,'eng');
  const text=r.data.text;
  const inv=text.match(/[A-Z]{2}[- ]?\d{8}/);
  if(inv){
    document.getElementById('invoiceNo').value=inv[0].replace('-','');
    navigator.vibrate && navigator.vibrate(100);
  }
  const nums=text.match(/\d{1,3}(,\d{3})*/g);
  if(nums){
    let max=0;
    nums.forEach(n=>{let v=parseInt(n.replace(/,/g,'')); if(v>max&&v<1000000) max=v;});
    if(max>0) document.getElementById('amount').value=max;
  }
 }catch(e){console.log(e);}
 scanning=false;
}
setInterval(scan,1500);
</script>
</body>
</html>
